# The shared icons are independent of each theme's layout and wallpaper.
set icondir=$prefix/theme/icons
export icondir
function caelestia_apply_theme {
  if [ "$caelestia_theme" = frieren ]; then
    set caelestia_layout=cards
  elif [ "$caelestia_theme" = split ]; then
    set caelestia_layout=split
  else
    set caelestia_layout=carousel
  fi
  set theme=$prefix/theme/$caelestia_theme/carousel.txt
  export theme
  export caelestia_theme
  export caelestia_layout
}
function caelestia_switch_theme {
  if [ "$caelestia_theme" = starlight ]; then
    set caelestia_theme=frieren
  elif [ "$caelestia_theme" = frieren ]; then
    set caelestia_theme=split
  else
    set caelestia_theme=starlight
  fi
  caelestia_apply_theme
}
caelestia_apply_theme
